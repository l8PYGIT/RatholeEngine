  </defs>
  <rect x="0" y="0" width="1200" height="680" rx="18" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="680" rx="18" fill="url(#orbA)"/>
  <rect x="0" y="0" width="1200" height="680" rx="18" fill="url(#orbB)"/>
  <rect x="0" y="0" width="1200" height="680" rx="18" fill="url(#dotGrid)"/>
  <rect x="20" y="16" width="1160" height="66" rx="14" fill="rgba(255,255,255,0.86)" stroke="rgba(15,23,42,0.11)" stroke-width="1.2"/>
  <text x="600.0" y="41" text-anchor="middle" fill="#0f172a" font-size="18.5" font-weight="700">Detailed Reference — Nginx Rules, Lanes &amp; Port Ownership</text>
  <text x="600.0" y="62" text-anchor="middle" fill="#475569" font-size="12.5">Everything inside Iran binds 127.0.0.1 except :443 (and optional lanes you explicitly enable).</text>
  <rect x="1108" y="27" width="56" height="22" rx="11" fill="rgba(0,122,255,0.11)" stroke="rgba(0,122,255,0.30)" stroke-width="1"/>
  <text x="1136" y="42" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="700">v2.1.0</text>
  <rect x="24" y="100" width="372" height="314" rx="14" fill="rgba(255,255,255,0.72)" stroke="#007aff" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="40" y="122" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#0c4a6e">NGINX :443 — L7 ROUTING</text>
  <rect x="40" y="134" width="340" height="46" rx="11" fill="#ffffff" stroke="#007aff" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="54" y="156" text-anchor="start" font-size="11" font-weight="700" fill="#0c4a6e">location = /_rh/&lt;32hex&gt;</text>
  <text x="54" y="175" text-anchor="start" font-size="11" fill="#1d4ed8">Secret rathole control path -&gt; :2333</text>
  <rect x="40" y="188" width="340" height="46" rx="11" fill="#ffffff" stroke="#007aff" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="54" y="210" text-anchor="start" font-size="11" font-weight="700" fill="#0c4a6e">location = / (Upgrade)</text>
  <text x="54" y="229" text-anchor="start" font-size="11" fill="#1d4ed8">Fallback WS control -&gt; :2333, else fake</text>
  <rect x="40" y="242" width="340" height="46" rx="11" fill="#ffffff" stroke="#007aff" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="54" y="264" text-anchor="start" font-size="11" font-weight="700" fill="#0c4a6e">location /&lt;node&gt;</text>
  <text x="54" y="283" text-anchor="start" font-size="11" fill="#1d4ed8">map $uri -&gt; 127.0.0.1:&lt;data port&gt;</text>
  <rect x="40" y="296" width="340" height="46" rx="11" fill="#ffffff" stroke="#007aff" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="54" y="318" text-anchor="start" font-size="11" font-weight="700" fill="#0c4a6e">location /channel|/tunnel</text>
  <text x="54" y="337" text-anchor="start" font-size="11" fill="#1d4ed8">Proxy to Backhaul 127.0.0.1:3080</text>
  <rect x="40" y="350" width="340" height="46" rx="11" fill="#ffffff" stroke="#007aff" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="54" y="372" text-anchor="start" font-size="11" font-weight="700" fill="#0c4a6e">location /hub/ &amp; /sub/</text>
  <text x="54" y="391" text-anchor="start" font-size="11" fill="#1d4ed8">Hub web panel :8088 &amp; subscriptions :2096</text>
  <rect x="414" y="100" width="356" height="314" rx="14" fill="rgba(255,255,255,0.72)" stroke="#059669" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="430" y="122" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#064e3b">RATHOLE LANE (LOOPBACK)</text>
  <rect x="430" y="134" width="324" height="56" rx="11" fill="#ffffff" stroke="#059669" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="444" y="156" text-anchor="start" font-size="11.5" font-weight="700" fill="#064e3b">Control :2333</text>
  <text x="444" y="175" text-anchor="start" font-size="11" fill="#047857">Serves ws / kcp / plain ingress</text>
  <rect x="430" y="200" width="324" height="56" rx="11" fill="#ffffff" stroke="#059669" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="444" y="222" text-anchor="start" font-size="11.5" font-weight="700" fill="#064e3b">Data Listeners :1001..</text>
  <text x="444" y="241" text-anchor="start" font-size="11" fill="#047857">Dedicated loopback port per node</text>
  <rect x="430" y="266" width="324" height="56" rx="11" fill="#ffffff" stroke="#059669" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="444" y="288" text-anchor="start" font-size="11.5" font-weight="700" fill="#064e3b">&lt;name&gt;_api Services</text>
  <text x="444" y="307" text-anchor="start" font-size="11" fill="#047857">Loopback panel &lt;-&gt; node mgmt bridge</text>
  <rect x="430" y="332" width="324" height="56" rx="11" fill="#ffffff" stroke="#059669" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="444" y="354" text-anchor="start" font-size="11.5" font-weight="700" fill="#064e3b">server.toml</text>
  <text x="444" y="373" text-anchor="start" font-size="11" fill="#047857">tls = false; in-place config_watcher</text>
  <rect x="788" y="100" width="388" height="314" rx="14" fill="rgba(255,255,255,0.72)" stroke="#7c3aed" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="804" y="122" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#4c1d95">INDEPENDENT LANES &amp; AGENT</text>
  <rect x="804" y="134" width="356" height="56" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="818" y="156" text-anchor="start" font-size="11.5" font-weight="700" fill="#4c1d95">Backhaul (SMUX)</text>
  <text x="818" y="175" text-anchor="start" font-size="11" fill="#6d28d9">127.0.0.1:3080 via Nginx /channel + /tunnel</text>
  <rect x="804" y="200" width="356" height="56" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="818" y="222" text-anchor="start" font-size="11.5" font-weight="700" fill="#4c1d95">FRP (fatedier/frp)</text>
  <text x="818" y="241" text-anchor="start" font-size="11" fill="#6d28d9">:7000/TCP (tcp/ws) + :7000/UDP (kcp/quic)</text>
  <rect x="804" y="266" width="356" height="56" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="818" y="288" text-anchor="start" font-size="11.5" font-weight="700" fill="#4c1d95">GRE L3 Kernel</text>
  <text x="818" y="307" text-anchor="start" font-size="11" fill="#6d28d9">gre1 10.10.10.0/30 · MTU 1476 · proto 47</text>
  <rect x="804" y="332" width="356" height="56" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="818" y="354" text-anchor="start" font-size="11.5" font-weight="700" fill="#4c1d95">REST Agent</text>
  <text x="818" y="373" text-anchor="start" font-size="11" fill="#6d28d9">rathole-agent.service :8089 (Bearer TLS)</text>
  <rect x="24" y="434" width="1152" height="206" rx="14" fill="rgba(255,255,255,0.72)" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="40" y="456" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#1e293b">PORT OWNERSHIP MAP — IRAN SERVER</text>
  <rect x="42" y="470" width="266" height="66" rx="11" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="175.0" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">443 / TCP</text>
  <text x="175.0" y="511" text-anchor="middle" font-size="11" fill="#047857">Nginx TLS / Stream · Public default</text>
  <rect x="324" y="470" width="266" height="66" rx="11" fill="#ffffff" stroke="#007aff" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="457.0" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">443 / UDP</text>
  <text x="457.0" y="511" text-anchor="middle" font-size="11" fill="#1d4ed8">kcptun server · Only if KCP on</text>
  <rect x="606" y="470" width="266" height="66" rx="11" fill="#ffffff" stroke="#d97706" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="739.0" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">8880 / TCP</text>
  <text x="739.0" y="511" text-anchor="middle" font-size="11" fill="#b45309">Nginx Plain HTTP · Optional lane</text>
  <rect x="888" y="470" width="266" height="66" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="1021.0" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">2334 / TCP</text>
  <text x="1021.0" y="511" text-anchor="middle" font-size="11" fill="#6d28d9">rathole-noise · Optional lane</text>
  <rect x="42" y="548" width="266" height="66" rx="11" fill="#ffffff" stroke="#d97706" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="175.0" y="570" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">7000 / TCP+UDP</text>
  <text x="175.0" y="589" text-anchor="middle" font-size="11" fill="#b45309">frps Server · Optional FRP lane</text>
  <rect x="324" y="548" width="266" height="66" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="457.0" y="570" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">8089 / TCP</text>
  <text x="457.0" y="589" text-anchor="middle" font-size="11" fill="#6d28d9">REST Agent API · Optional HTTP(S)</text>
  <rect x="606" y="548" width="266" height="66" rx="11" fill="#ffffff" stroke="#64748b" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="739.0" y="570" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">127.0.0.1:2333</text>
  <text x="739.0" y="589" text-anchor="middle" font-size="11" fill="#475569">rathole control · Loopback only</text>
  <rect x="888" y="548" width="266" height="66" rx="11" fill="#ffffff" stroke="#64748b" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="1021.0" y="570" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">127.0.0.1:3080</text>
  <text x="1021.0" y="589" text-anchor="middle" font-size="11" fill="#475569">backhaul-server · Loopback only</text>
  <text x="24" y="662" text-anchor="start" font-size="11" font-weight="500" fill="#64748b">Green = exposed by default. Other ports open ONLY when that specific carrier or agent is explicitly enabled.</text>
</svg>
