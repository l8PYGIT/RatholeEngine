<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 740" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrU" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="740" fill="#ffffff"/>
  <rect x="20" y="16" width="1120" height="60" rx="8" fill="#0f172a"/>
  <text x="580" y="39" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">Detailed reference — nginx rules, lanes and port ownership</text>
  <text x="580" y="59" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Everything on the Iran side is 127.0.0.1 except :443 (and the optional lane ports you enable).</text>
  <rect x="20" y="96" width="360" height="352" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">NGINX :443 — L7 (default)</text>
  <rect x="36" y="136" width="328" height="53" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200.0" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">location = /</text>
  <text x="200.0" y="177" text-anchor="middle" font-size="11" fill="#1d4ed8">websocket → control backend, else fake site</text>
  <rect x="36" y="197" width="328" height="53" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200.0" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">location /&lt;node&gt;</text>
  <text x="200.0" y="238" text-anchor="middle" font-size="11" fill="#1d4ed8">map $uri → 127.0.0.1:&lt;data port&gt;</text>
  <rect x="36" y="258" width="328" height="53" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200.0" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">location /_rh/&lt;hex&gt;</text>
  <text x="200.0" y="299" text-anchor="middle" font-size="11" fill="#1d4ed8">secret rathole control path</text>
  <rect x="36" y="319" width="328" height="53" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200.0" y="341" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">location /channel|/tunnel</text>
  <text x="200.0" y="360" text-anchor="middle" font-size="11" fill="#1d4ed8">→ backhaul-server 127.0.0.1:3080</text>
  <rect x="36" y="380" width="328" height="53" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="200.0" y="402" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">location /sub/</text>
  <text x="200.0" y="421" text-anchor="middle" font-size="11" fill="#1d4ed8">→ Pasargad subscriptions :2096</text>
  <rect x="400" y="96" width="340" height="352" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">RATHOLE LANE</text>
  <rect x="416" y="136" width="308" height="53" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570.0" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">control :2333</text>
  <text x="570.0" y="177" text-anchor="middle" font-size="11" fill="#166534">ws / kcp / plain / noise</text>
  <rect x="416" y="197" width="308" height="53" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570.0" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">data :1001..</text>
  <text x="570.0" y="238" text-anchor="middle" font-size="11" fill="#166534">one listener per node</text>
  <rect x="416" y="258" width="308" height="53" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570.0" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">*_api services</text>
  <text x="570.0" y="299" text-anchor="middle" font-size="11" fill="#166534">panel ↔ node, loopback only</text>
  <rect x="416" y="319" width="308" height="53" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="570.0" y="341" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">server.toml</text>
  <text x="570.0" y="360" text-anchor="middle" font-size="11" fill="#166534">transport tls = false</text>
  <text x="570" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">config_watcher hot-reloads in place</text>
  <rect x="760" y="96" width="380" height="352" rx="12" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="950" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">INDEPENDENT LANES</text>
  <rect x="776" y="136" width="348" height="53" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="950.0" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#701a75">Backhaul (SMUX)</text>
  <text x="950.0" y="177" text-anchor="middle" font-size="11" fill="#86198f">127.0.0.1:3080 · /channel + /tunnel</text>
  <rect x="776" y="197" width="348" height="53" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="950.0" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#701a75">FRP</text>
  <text x="950.0" y="238" text-anchor="middle" font-size="11" fill="#86198f">frps :7000 · tcp|kcp|quic|websocket</text>
  <rect x="776" y="258" width="348" height="53" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="950.0" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#701a75">GRE</text>
  <text x="950.0" y="299" text-anchor="middle" font-size="11" fill="#86198f">gre1 · 10.10.10.0/30 · MTU 1476</text>
  <rect x="776" y="319" width="348" height="53" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="950.0" y="341" text-anchor="middle" font-size="11" font-weight="bold" fill="#701a75">REST Agent</text>
  <text x="950.0" y="360" text-anchor="middle" font-size="11" fill="#86198f">rathole-agent.service :8089</text>
  <text x="950" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#86198f">start/stop independently of the rathole lane</text>
  <rect x="20" y="472" width="1120" height="196" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="580" y="498" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">PORT MAP — who listens where on the Iran server</text>
  <rect x="36" y="512" width="132" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="102.0" y="534" text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">443/tcp</text>
  <text x="102.0" y="553" text-anchor="middle" font-size="11" fill="#047857">nginx</text>
  <text x="102.0" y="570" text-anchor="middle" font-size="11" fill="#047857">public · TLS</text>
  <rect x="176" y="512" width="132" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="242.0" y="534" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">443/udp</text>
  <text x="242.0" y="553" text-anchor="middle" font-size="11" fill="#475569">kcptun</text>
  <text x="242.0" y="570" text-anchor="middle" font-size="11" fill="#475569">only if kcp is on</text>
  <rect x="316" y="512" width="132" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="382.0" y="534" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">8880/tcp</text>
  <text x="382.0" y="553" text-anchor="middle" font-size="11" fill="#475569">plain ws</text>
  <text x="382.0" y="570" text-anchor="middle" font-size="11" fill="#475569">optional lane</text>
  <rect x="456" y="512" width="132" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="522.0" y="534" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">2334/tcp</text>
  <text x="522.0" y="553" text-anchor="middle" font-size="11" fill="#475569">rathole-noise</text>
  <text x="522.0" y="570" text-anchor="middle" font-size="11" fill="#475569">optional lane</text>
  <rect x="596" y="512" width="132" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="662.0" y="534" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">7000/tcp+udp</text>
  <text x="662.0" y="553" text-anchor="middle" font-size="11" fill="#475569">frps</text>
  <text x="662.0" y="570" text-anchor="middle" font-size="11" fill="#475569">optional lane</text>
  <rect x="736" y="512" width="132" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="802.0" y="534" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">8089/tcp</text>
  <text x="802.0" y="553" text-anchor="middle" font-size="11" fill="#475569">REST agent</text>
  <text x="802.0" y="570" text-anchor="middle" font-size="11" fill="#475569">optional, token</text>
  <rect x="876" y="512" width="132" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="942.0" y="534" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">127.0.0.1:2333</text>
  <text x="942.0" y="553" text-anchor="middle" font-size="11" fill="#475569">control</text>
  <text x="942.0" y="570" text-anchor="middle" font-size="11" fill="#475569">loopback only</text>
  <rect x="1016" y="512" width="132" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1082.0" y="534" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">127.0.0.1:3080</text>
  <text x="1082.0" y="553" text-anchor="middle" font-size="11" fill="#475569">backhaul</text>
  <text x="1082.0" y="570" text-anchor="middle" font-size="11" fill="#475569">loopback only</text>
  <text x="580" y="626" text-anchor="middle" font-size="11.5" fill="#64748b">green = exposed by default · white = opened only when you enable that lane</text>
  <text x="20" y="712" text-anchor="start" font-size="11.5" fill="#64748b">User paths never move between lanes: the nginx map target and the node inbound stay the same when you switch carrier.</text>
</svg>
