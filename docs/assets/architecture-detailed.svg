  </defs>
  <rect x="0" y="0" width="1200" height="680" rx="18" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="680" rx="18" fill="url(#orbA)"/>
  <rect x="0" y="0" width="1200" height="680" rx="18" fill="url(#orbB)"/>
  <rect x="0" y="0" width="1200" height="680" rx="18" fill="url(#dotGrid)"/>
  <rect x="20" y="16" width="1160" height="66" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.13)" stroke-width="1.2"/>
  <text x="600.0" y="41" text-anchor="middle" fill="#f8fafc" font-size="18.5" font-weight="700">Detailed Reference — Nginx Rules, Lanes &amp; Port Ownership</text>
  <text x="600.0" y="62" text-anchor="middle" fill="#94a3b8" font-size="12.5">Everything inside Iran binds 127.0.0.1 except :443 (and optional lanes you explicitly enable).</text>
  <rect x="1108" y="27" width="56" height="22" rx="11" fill="rgba(10,132,255,0.20)" stroke="rgba(56,189,248,0.45)" stroke-width="1"/>
  <text x="1136" y="42" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700">v2.1.0</text>
  <rect x="24" y="100" width="372" height="314" rx="14" fill="rgba(15,23,42,0.58)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="40" y="122" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#e0f2fe">NGINX :443 — L7 ROUTING</text>
  <rect x="40" y="134" width="340" height="46" rx="11" fill="#0f192e" stroke="#38bdf8" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="54" y="156" text-anchor="start" font-size="11" font-weight="700" fill="#e0f2fe">location = /_rh/&lt;32hex&gt;</text>
  <text x="54" y="175" text-anchor="start" font-size="11" fill="#93c5fd">Secret rathole control path -&gt; :2333</text>
  <rect x="40" y="188" width="340" height="46" rx="11" fill="#0f192e" stroke="#38bdf8" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="54" y="210" text-anchor="start" font-size="11" font-weight="700" fill="#e0f2fe">location = / (Upgrade)</text>
  <text x="54" y="229" text-anchor="start" font-size="11" fill="#93c5fd">Fallback WS control -&gt; :2333, else fake</text>
  <rect x="40" y="242" width="340" height="46" rx="11" fill="#0f192e" stroke="#38bdf8" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="54" y="264" text-anchor="start" font-size="11" font-weight="700" fill="#e0f2fe">location /&lt;node&gt;</text>
  <text x="54" y="283" text-anchor="start" font-size="11" fill="#93c5fd">map $uri -&gt; 127.0.0.1:&lt;data port&gt;</text>
  <rect x="40" y="296" width="340" height="46" rx="11" fill="#0f192e" stroke="#38bdf8" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="54" y="318" text-anchor="start" font-size="11" font-weight="700" fill="#e0f2fe">location /channel|/tunnel</text>
  <text x="54" y="337" text-anchor="start" font-size="11" fill="#93c5fd">Proxy to Backhaul 127.0.0.1:3080</text>
  <rect x="40" y="350" width="340" height="46" rx="11" fill="#0f192e" stroke="#38bdf8" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="54" y="372" text-anchor="start" font-size="11" font-weight="700" fill="#e0f2fe">location /hub/ &amp; /sub/</text>
  <text x="54" y="391" text-anchor="start" font-size="11" fill="#93c5fd">Hub web panel :8088 &amp; subscriptions :2096</text>
  <rect x="414" y="100" width="356" height="314" rx="14" fill="rgba(15,23,42,0.58)" stroke="#34d399" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="430" y="122" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#d1fae5">RATHOLE LANE (LOOPBACK)</text>
  <rect x="430" y="134" width="324" height="56" rx="11" fill="#0f192e" stroke="#34d399" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="444" y="156" text-anchor="start" font-size="11.5" font-weight="700" fill="#d1fae5">Control :2333</text>
  <text x="444" y="175" text-anchor="start" font-size="11" fill="#86efac">Serves ws / kcp / plain ingress</text>
  <rect x="430" y="200" width="324" height="56" rx="11" fill="#0f192e" stroke="#34d399" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="444" y="222" text-anchor="start" font-size="11.5" font-weight="700" fill="#d1fae5">Data Listeners :1001..</text>
  <text x="444" y="241" text-anchor="start" font-size="11" fill="#86efac">Dedicated loopback port per node</text>
  <rect x="430" y="266" width="324" height="56" rx="11" fill="#0f192e" stroke="#34d399" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="444" y="288" text-anchor="start" font-size="11.5" font-weight="700" fill="#d1fae5">&lt;name&gt;_api Services</text>
  <text x="444" y="307" text-anchor="start" font-size="11" fill="#86efac">Loopback panel &lt;-&gt; node mgmt bridge</text>
  <rect x="430" y="332" width="324" height="56" rx="11" fill="#0f192e" stroke="#34d399" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="444" y="354" text-anchor="start" font-size="11.5" font-weight="700" fill="#d1fae5">server.toml</text>
  <text x="444" y="373" text-anchor="start" font-size="11" fill="#86efac">tls = false; in-place config_watcher</text>
  <rect x="788" y="100" width="388" height="314" rx="14" fill="rgba(15,23,42,0.58)" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="804" y="122" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#ede9fe">INDEPENDENT LANES &amp; AGENT</text>
  <rect x="804" y="134" width="356" height="56" rx="11" fill="#0f192e" stroke="#a78bfa" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="818" y="156" text-anchor="start" font-size="11.5" font-weight="700" fill="#ede9fe">Backhaul (SMUX)</text>
  <text x="818" y="175" text-anchor="start" font-size="11" fill="#c4b5fd">127.0.0.1:3080 via Nginx /channel + /tunnel</text>
  <rect x="804" y="200" width="356" height="56" rx="11" fill="#0f192e" stroke="#a78bfa" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="818" y="222" text-anchor="start" font-size="11.5" font-weight="700" fill="#ede9fe">FRP (fatedier/frp)</text>
  <text x="818" y="241" text-anchor="start" font-size="11" fill="#c4b5fd">:7000/TCP (tcp/ws) + :7000/UDP (kcp/quic)</text>
  <rect x="804" y="266" width="356" height="56" rx="11" fill="#0f192e" stroke="#a78bfa" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="818" y="288" text-anchor="start" font-size="11.5" font-weight="700" fill="#ede9fe">GRE L3 Kernel</text>
  <text x="818" y="307" text-anchor="start" font-size="11" fill="#c4b5fd">gre1 10.10.10.0/30 · MTU 1476 · proto 47</text>
  <rect x="804" y="332" width="356" height="56" rx="11" fill="#0f192e" stroke="#a78bfa" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="818" y="354" text-anchor="start" font-size="11.5" font-weight="700" fill="#ede9fe">REST Agent</text>
  <text x="818" y="373" text-anchor="start" font-size="11" fill="#c4b5fd">rathole-agent.service :8089 (Bearer TLS)</text>
  <rect x="24" y="434" width="1152" height="206" rx="14" fill="rgba(15,23,42,0.58)" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="40" y="456" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#f1f5f9">PORT OWNERSHIP MAP — IRAN SERVER</text>
  <rect x="42" y="470" width="266" height="66" rx="11" fill="rgba(16,185,129,0.12)" stroke="#34d399" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="175.0" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#d1fae5">443 / TCP</text>
  <text x="175.0" y="511" text-anchor="middle" font-size="11" fill="#86efac">Nginx TLS / Stream · Public default</text>
  <rect x="324" y="470" width="266" height="66" rx="11" fill="#0f192e" stroke="#38bdf8" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="457.0" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#e0f2fe">443 / UDP</text>
  <text x="457.0" y="511" text-anchor="middle" font-size="11" fill="#93c5fd">kcptun server · Only if KCP on</text>
  <rect x="606" y="470" width="266" height="66" rx="11" fill="#0f192e" stroke="#fbbf24" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="739.0" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#fef3c7">8880 / TCP</text>
  <text x="739.0" y="511" text-anchor="middle" font-size="11" fill="#fcd34d">Nginx Plain HTTP · Optional lane</text>
  <rect x="888" y="470" width="266" height="66" rx="11" fill="#0f192e" stroke="#a78bfa" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="1021.0" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#ede9fe">2334 / TCP</text>
  <text x="1021.0" y="511" text-anchor="middle" font-size="11" fill="#c4b5fd">rathole-noise · Optional lane</text>
  <rect x="42" y="548" width="266" height="66" rx="11" fill="#0f192e" stroke="#fbbf24" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="175.0" y="570" text-anchor="middle" font-size="12" font-weight="700" fill="#fef3c7">7000 / TCP+UDP</text>
  <text x="175.0" y="589" text-anchor="middle" font-size="11" fill="#fcd34d">frps Server · Optional FRP lane</text>
  <rect x="324" y="548" width="266" height="66" rx="11" fill="#0f192e" stroke="#a78bfa" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="457.0" y="570" text-anchor="middle" font-size="12" font-weight="700" fill="#ede9fe">8089 / TCP</text>
  <text x="457.0" y="589" text-anchor="middle" font-size="11" fill="#c4b5fd">REST Agent API · Optional HTTP(S)</text>
  <rect x="606" y="548" width="266" height="66" rx="11" fill="#0f192e" stroke="#64748b" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="739.0" y="570" text-anchor="middle" font-size="12" font-weight="700" fill="#f1f5f9">127.0.0.1:2333</text>
  <text x="739.0" y="589" text-anchor="middle" font-size="11" fill="#cbd5e1">rathole control · Loopback only</text>
  <rect x="888" y="548" width="266" height="66" rx="11" fill="#0f192e" stroke="#64748b" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="1021.0" y="570" text-anchor="middle" font-size="12" font-weight="700" fill="#f1f5f9">127.0.0.1:3080</text>
  <text x="1021.0" y="589" text-anchor="middle" font-size="11" fill="#cbd5e1">backhaul-server · Loopback only</text>
  <text x="24" y="662" text-anchor="start" font-size="11" font-weight="500" fill="#94a3b8">Green = exposed by default. Other ports open ONLY when that specific carrier or agent is explicitly enabled.</text>
</svg>
