  <text x="846" y="493.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4c1d95">SSH / Agent</text>
  <text x="24" y="640" text-anchor="start" font-size="11" font-weight="500" fill="#64748b">TLS terminates at Nginx (except Game/SNI on node &amp; Noise own crypto). State changes regenerate configs in place preserving inodes.</text>
