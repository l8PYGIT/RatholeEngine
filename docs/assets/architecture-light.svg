  <text x="40" y="122" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#0c4a6e">USERS · IRAN</text>
  <rect x="40" y="136" width="208" height="74" rx="11" fill="#ffffff" stroke="#007aff" stroke-opacity="0.58" stroke-width="1.2"/>
