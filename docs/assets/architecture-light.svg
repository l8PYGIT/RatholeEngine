  <text x="570.0" y="335" text-anchor="middle" font-size="11" fill="#b45309">frps :7000</text>
  <text x="570.0" y="352" text-anchor="middle" font-size="11" fill="#b45309">TCP + UDP (kcp/quic)</text>
  <rect x="654" y="294" width="146" height="74" rx="11" fill="#ffffff" stroke="#d97706" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="727.0" y="316" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f">GRE L3 Kernel</text>
  <text x="727.0" y="335" text-anchor="middle" font-size="11" fill="#b45309">gre1 /30 (proto 47)</text>
  <text x="727.0" y="352" text-anchor="middle" font-size="11" fill="#b45309">MTU 1476 + TCPMSS</text>
  <rect x="340" y="390" width="460" height="74" rx="11" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="570.0" y="412" text-anchor="middle" font-size="12.5" font-weight="700" fill="#064e3b">Services &amp; Node Inventory (state.json)</text>
  <text x="570.0" y="431" text-anchor="middle" font-size="11" fill="#047857">/trk01 -&gt; :1001   /nld01 -&gt; :1002   /usa01 -&gt; :1003</text>
  <text x="570.0" y="448" text-anchor="middle" font-size="11" fill="#047857">Loopback &lt;name&gt;_api services for panel &lt;-&gt; node sync</text>
  <rect x="876" y="100" width="300" height="344" rx="14" fill="rgba(255,255,255,0.72)" stroke="#7c3aed" stroke-opacity="0.45" stroke-width="1.3"/>
