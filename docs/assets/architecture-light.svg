  <text x="1026.0" y="177" text-anchor="middle" font-size="11" fill="#6d28d9">/trk01 -&gt; :2087 · outbound tunnel</text>
  <rect x="894" y="214" width="264" height="57" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="1026.0" y="236" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">de-node2 · Xray + Client</text>
  <text x="1026.0" y="255" text-anchor="middle" font-size="11" fill="#6d28d9">/nld01 -&gt; :2087 · Backhaul / FRP</text>
  <rect x="894" y="292" width="264" height="57" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="1026.0" y="314" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">us-node3 · Xray + Client</text>
  <text x="1026.0" y="333" text-anchor="middle" font-size="11" fill="#6d28d9">/usa01 -&gt; :2087 · WS / KCP / GRE</text>
  <text x="1026" y="392" text-anchor="middle" font-size="10.5" font-weight="500" fill="#64748b">Matching clients: rathole / backhaul / frpc</text>
  <text x="1026" y="412" text-anchor="middle" font-size="10.5" font-weight="500" fill="#64748b">services.conf + bh-services.conf</text>
  <rect x="876" y="464" width="300" height="152" rx="14" fill="rgba(255,255,255,0.72)" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="892" y="486" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#1e293b">OPEN INTERNET</text>
  <rect x="894" y="498" width="264" height="57" rx="11" fill="#ffffff" stroke="#64748b" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="1026.0" y="520" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">Xray Exit -&gt; Target</text>
  <text x="1026.0" y="539" text-anchor="middle" font-size="11" fill="#475569">Decrypts VLESS &amp; forwards traffic</text>
  <rect x="24" y="514" width="794" height="102" rx="14" fill="rgba(255,255,255,0.72)" stroke="#7c3aed" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="40" y="536" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#4c1d95">MANAGEMENT PLANE — RATHOLEHUB + REST AGENT</text>
  <rect x="40" y="546" width="370" height="57" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="225.0" y="568" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">RatholeHub (hub.py + Apple Glass UI)</text>
  <text x="225.0" y="587" text-anchor="middle" font-size="11" fill="#6d28d9">SSH key argv OR HTTPS REST API · Ctrl+K · two-sided sync</text>
  <rect x="430" y="546" width="370" height="57" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="615.0" y="568" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">REST Agent (ratholeagent.py :8089)</text>
  <text x="615.0" y="587" text-anchor="middle" font-size="11" fill="#6d28d9">Optional SSH-free daemon · Bearer token (0600) · strict allow-list</text>
