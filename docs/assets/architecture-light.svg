  <text x="144.0" y="177" text-anchor="middle" font-size="11" fill="#1d4ed8">VLESS + WebSocket + TLS</text>
  <text x="144.0" y="194" text-anchor="middle" font-size="11" fill="#1d4ed8">wss://domain:443/trk01</text>
  <rect x="40" y="234" width="208" height="74" rx="11" fill="#ffffff" stroke="#007aff" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="144.0" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c4a6e">Direct-IP Client</text>
  <text x="144.0" y="275" text-anchor="middle" font-size="11" fill="#1d4ed8">Raw Iran IP · :8081 HTTP</text>
  <text x="144.0" y="292" text-anchor="middle" font-size="11" fill="#1d4ed8">Header X-Cdn-Id: &lt;node&gt;</text>
  <rect x="40" y="332" width="208" height="74" rx="11" fill="#ffffff" stroke="#007aff" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="144.0" y="354" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c4a6e">Browser / Web Hub</text>
  <text x="144.0" y="373" text-anchor="middle" font-size="11" fill="#1d4ed8">Fake site on /</text>
  <text x="144.0" y="390" text-anchor="middle" font-size="11" fill="#1d4ed8">Admin Hub on /hub/</text>
  <text x="144" y="466" text-anchor="middle" font-size="10.5" font-weight="500" fill="#64748b">Zero client port config change</text>
  <rect x="322" y="100" width="496" height="396" rx="14" fill="rgba(255,255,255,0.72)" stroke="#059669" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="338" y="122" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#064e3b">IRAN SERVER — PUBLIC :443 DEFAULT</text>
  <rect x="340" y="136" width="460" height="57" rx="11" fill="#ffffff" stroke="#059669" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="570.0" y="158" text-anchor="middle" font-size="12.5" font-weight="700" fill="#064e3b">Nginx Edge :443 (HTTPS / Stream SNI)</text>
  <text x="570.0" y="177" text-anchor="middle" font-size="11" fill="#047857">Terminates Let's Encrypt TLS · map $uri -&gt; 127.0.0.1:&lt;port&gt;</text>
  <rect x="340" y="214" width="460" height="57" rx="11" fill="#ffffff" stroke="#059669" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="570.0" y="236" text-anchor="middle" font-size="12.5" font-weight="700" fill="#064e3b">Rathole Server (Loopback)</text>
  <text x="570.0" y="255" text-anchor="middle" font-size="11" fill="#047857">ws/kcp/plain/noise · tls = false · secret control /_rh/&lt;hex&gt; -&gt; :2333</text>
  <rect x="340" y="294" width="146" height="74" rx="11" fill="#ffffff" stroke="#d97706" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="413.0" y="316" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f">Backhaul SMUX</text>
  <text x="413.0" y="335" text-anchor="middle" font-size="11" fill="#b45309">127.0.0.1:3080</text>
  <text x="413.0" y="352" text-anchor="middle" font-size="11" fill="#b45309">/channel + /tunnel</text>
  <rect x="497" y="294" width="146" height="74" rx="11" fill="#ffffff" stroke="#d97706" stroke-opacity="0.58" stroke-width="1.2"/>
