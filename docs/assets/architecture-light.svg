  <text x="600.0" y="41" text-anchor="middle" fill="#0f172a" font-size="18.5" font-weight="700">RatholeEngine — 4 Roles, 1 Public Port (:443)</text>
  <text x="600.0" y="62" text-anchor="middle" fill="#475569" font-size="12.5">One domain · one TLS cert · URL-path routing to many foreign nodes · SSH &amp; REST Agent control</text>
