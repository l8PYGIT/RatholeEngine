<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrU" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="760" fill="#ffffff"/>
  <rect x="20" y="16" width="1120" height="60" rx="8" fill="#0f172a"/>
  <text x="580" y="39" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">RatholeEngine — 4 roles, 1 public port</text>
  <text x="580" y="59" text-anchor="middle" fill="#cbd5e1" font-size="12.5">One domain · one certificate · nginx :443 · user traffic routed to a node by URL path.</text>
  <rect x="20" y="96" width="240" height="300" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">USERS (IRAN)</text>
  <rect x="40" y="132" width="200" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140.0" y="154" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">Xray / V2Ray client</text>
  <text x="140.0" y="173" text-anchor="middle" font-size="11" fill="#1d4ed8">VLESS + WS</text>
  <text x="140.0" y="190" text-anchor="middle" font-size="11" fill="#1d4ed8">addr = domain:443</text>
  <rect x="40" y="226" width="200" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140.0" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">Direct-IP client</text>
  <text x="140.0" y="267" text-anchor="middle" font-size="11" fill="#1d4ed8">hidden header</text>
  <text x="140.0" y="284" text-anchor="middle" font-size="11" fill="#1d4ed8">X-Cdn-Id: &lt;node&gt;</text>
  <rect x="40" y="320" width="200" height="53" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140.0" y="342" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">Browser</text>
  <text x="140.0" y="361" text-anchor="middle" font-size="11" fill="#1d4ed8">fake site / panel</text>
  <rect x="300" y="96" width="460" height="600" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">IRAN SERVER — public :443 only</text>
  <rect x="320" y="134" width="420" height="53" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530.0" y="156" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">nginx :443</text>
  <text x="530.0" y="175" text-anchor="middle" font-size="11" fill="#166534">TLS termination (Let's Encrypt) · map $uri → backend port</text>
  <rect x="320" y="218" width="420" height="53" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530.0" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">rathole server</text>
  <text x="530.0" y="259" text-anchor="middle" font-size="11" fill="#166534">transport websocket · tls = false · control :2333</text>
  <rect x="320" y="292" width="420" height="53" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530.0" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">Backhaul (SMUX lane)</text>
  <text x="530.0" y="333" text-anchor="middle" font-size="11" fill="#166534">backhaul-server 127.0.0.1:3080 · /channel + /tunnel</text>
  <rect x="320" y="355" width="420" height="53" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530.0" y="377" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">FRP lane</text>
  <text x="530.0" y="396" text-anchor="middle" font-size="11" fill="#166534">frps :7000 · tcp|kcp|quic|websocket</text>
  <rect x="320" y="418" width="420" height="53" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530.0" y="440" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">GRE lane</text>
  <text x="530.0" y="459" text-anchor="middle" font-size="11" fill="#166534">gre1 10.10.10.1/30 · MTU 1476 · proto 47</text>
  <rect x="320" y="485" width="420" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="530.0" y="507" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#065f46">Services / inventory</text>
  <text x="530.0" y="526" text-anchor="middle" font-size="11" fill="#047857">/trk01 → 127.0.0.1:1001   /nld01 → :1002   /usa01 → :1003</text>
  <text x="530.0" y="543" text-anchor="middle" font-size="11" fill="#047857">+ &lt;name&gt;_api services (loopback) for panel ↔ node</text>
  <rect x="800" y="96" width="340" height="420" rx="12" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="970" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">FOREIGN NODES — no public port</text>
  <rect x="820" y="134" width="300" height="70" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="970.0" y="156" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#701a75">trk01 — Xray</text>
  <text x="970.0" y="175" text-anchor="middle" font-size="11" fill="#86198f">/trk01 · inbound :2087</text>
  <text x="970.0" y="192" text-anchor="middle" font-size="11" fill="#86198f">outbound-only tunnel</text>
  <rect x="820" y="216" width="300" height="70" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="970.0" y="238" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#701a75">nld01 — Xray</text>
  <text x="970.0" y="257" text-anchor="middle" font-size="11" fill="#86198f">/nld01 · inbound :2087</text>
  <text x="970.0" y="274" text-anchor="middle" font-size="11" fill="#86198f">outbound-only tunnel</text>
  <rect x="820" y="298" width="300" height="70" rx="8" fill="#ffffff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="970.0" y="320" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#701a75">usa01 — Xray</text>
  <text x="970.0" y="339" text-anchor="middle" font-size="11" fill="#86198f">/usa01 · inbound :2087</text>
  <text x="970.0" y="356" text-anchor="middle" font-size="11" fill="#86198f">outbound-only tunnel</text>
  <text x="970" y="398" text-anchor="middle" font-size="11" fill="#701a75">each node runs the matching client:</text>
  <text x="970" y="416" text-anchor="middle" font-size="11" fill="#701a75">rathole / backhaul / frpc</text>
  <rect x="800" y="536" width="340" height="160" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="970" y="560" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">OPEN INTERNET</text>
  <rect x="820" y="572" width="300" height="53" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="970.0" y="594" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">Xray on the node</text>
  <text x="970.0" y="613" text-anchor="middle" font-size="11" fill="#475569">opens VLESS → target</text>
  <rect x="820" y="636" width="300" height="36" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="970.0" y="658" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#334155">user traffic exits here</text>
  <line x1="240" y1="163" x2="316" y2="163" stroke="#334155" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="970" y1="516" x2="970" y2="536" stroke="#9333ea" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrU)"/>
  <line x1="740" y1="255" x2="800" y2="150" stroke="#9333ea" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrU)"/>
  <text x="690" y="232" text-anchor="end" font-size="10.5" fill="#9333ea">reverse tunnel</text>
  <text x="278" y="150" text-anchor="middle" font-size="10.5" fill="#475569">https / wss 443</text>
  <text x="20" y="736" text-anchor="start" font-size="11.5" fill="#64748b">TLS is terminated only by nginx (except: game/SNI terminates on the node, noise carries its own crypto).</text>
</svg>
