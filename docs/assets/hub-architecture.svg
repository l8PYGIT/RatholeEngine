<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 780" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrU" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="780" fill="#ffffff"/>
  <rect x="20" y="16" width="1120" height="60" rx="8" fill="#0f172a"/>
  <text x="580" y="39" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">Hub — one control plane, two transports (SSH or REST Agent)</text>
  <text x="580" y="59" text-anchor="middle" fill="#cbd5e1" font-size="12.5">The hub never builds shell strings: every action becomes a validated argv list.</text>
  <rect x="20" y="96" width="250" height="240" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="145" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">ADMIN</text>
  <rect x="40" y="132" width="210" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="145.0" y="154" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">Browser UI</text>
  <text x="145.0" y="173" text-anchor="middle" font-size="11" fill="#1d4ed8">BEARER token or</text>
  <text x="145.0" y="190" text-anchor="middle" font-size="11" fill="#1d4ed8">rhsession cookie</text>
  <rect x="40" y="226" width="210" height="70" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="145.0" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">nginx /hub/</text>
  <text x="145.0" y="267" text-anchor="middle" font-size="11" fill="#1d4ed8">TLS + public entry</text>
  <text x="145.0" y="284" text-anchor="middle" font-size="11" fill="#1d4ed8">→ 127.0.0.1:8088</text>
  <rect x="300" y="96" width="400" height="560" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="500" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">HUB (hub.py — stdlib only, loopback)</text>
  <rect x="320" y="132" width="360" height="53" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="500.0" y="154" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">Handler (ThreadingHTTPServer)</text>
  <text x="500.0" y="173" text-anchor="middle" font-size="11" fill="#475569">auth · login rate-limit · audit log</text>
  <rect x="320" y="206" width="360" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="500.0" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">hubcmds.py — allow-list</text>
  <text x="500.0" y="247" text-anchor="middle" font-size="11" fill="#475569">action + args → validated argv</text>
  <text x="500.0" y="264" text-anchor="middle" font-size="11" fill="#475569">every arg checked by RE_* regex</text>
  <rect x="320" y="290" width="170" height="87" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="405.0" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065f46">SSH transport</text>
  <text x="405.0" y="331" text-anchor="middle" font-size="11" fill="#047857">run_on_server</text>
  <text x="405.0" y="348" text-anchor="middle" font-size="11" fill="#047857">_ssh_base</text>
  <text x="405.0" y="365" text-anchor="middle" font-size="11" fill="#047857">argv, one arg each</text>
  <rect x="510" y="290" width="170" height="87" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="595.0" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4c1d95">REST Agent</text>
  <text x="595.0" y="331" text-anchor="middle" font-size="11" fill="#5b21b6">run_on_agent</text>
  <text x="595.0" y="348" text-anchor="middle" font-size="11" fill="#5b21b6">POST /api/exec</text>
  <text x="595.0" y="365" text-anchor="middle" font-size="11" fill="#5b21b6">Bearer token</text>
  <rect x="320" y="398" width="360" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="500.0" y="420" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">Persistent state</text>
  <text x="500.0" y="439" text-anchor="middle" font-size="11" fill="#475569">inventory.json · config.json</text>
  <text x="500.0" y="456" text-anchor="middle" font-size="11" fill="#475569">atomic writes under a lock</text>
  <rect x="320" y="478" width="360" height="87" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500.0" y="500" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a8a">Service controls (v2.0.2)</text>
  <text x="500.0" y="519" text-anchor="middle" font-size="11" fill="#1d4ed8">carrier + protocol · health test · VLESS config</text>
  <text x="500.0" y="536" text-anchor="middle" font-size="11" fill="#1d4ed8">manage peer · remove both ends</text>
  <text x="500.0" y="553" text-anchor="middle" font-size="11" fill="#1d4ed8">carrier labels show the reported protocol (? = unknown)</text>
  <rect x="730" y="96" width="410" height="640" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="935" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">MANAGED FLEET (inventory.json)</text>
  <rect x="750" y="132" width="370" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="935.0" y="154" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">Iran server #1 (role: iran)</text>
  <text x="935.0" y="173" text-anchor="middle" font-size="11" fill="#166534">ratholectl — rathole server + nginx</text>
  <text x="935.0" y="190" text-anchor="middle" font-size="11" fill="#166534">add/rm node · kcp · noise · backhaul · frp · gre</text>
  <rect x="750" y="230" width="370" height="53" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="935.0" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">Iran server #2 … N</text>
  <text x="935.0" y="271" text-anchor="middle" font-size="11" fill="#166534">each fronts its own domain / 443</text>
  <rect x="750" y="296" width="370" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="935.0" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">Foreign node #1 (role: node)</text>
  <text x="935.0" y="337" text-anchor="middle" font-size="11" fill="#166534">ratholenode — rathole client</text>
  <text x="935.0" y="354" text-anchor="middle" font-size="11" fill="#166534">services.conf + bh-services.conf</text>
  <rect x="750" y="394" width="370" height="53" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="935.0" y="416" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#14532d">Foreign node #2 … N</text>
  <text x="935.0" y="435" text-anchor="middle" font-size="11" fill="#166534">outbound-only tunnels</text>
  <rect x="750" y="460" width="370" height="87" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="935.0" y="482" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065f46">Lifecycle</text>
  <text x="935.0" y="501" text-anchor="middle" font-size="11" fill="#047857">deploy_to_server → install.sh --update on the server</text>
  <text x="935.0" y="518" text-anchor="middle" font-size="11" fill="#047857">snapshot → health check → auto-rollback</text>
  <text x="935.0" y="535" text-anchor="middle" font-size="11" fill="#047857">audit log: user · server · action · rc</text>
  <rect x="750" y="576" width="370" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="935.0" y="598" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4c1d95">REST Agent (optional)</text>
  <text x="935.0" y="617" text-anchor="middle" font-size="11" fill="#5b21b6">ratholeagent.py · rathole-agent.service :8089</text>
  <text x="935.0" y="634" text-anchor="middle" font-size="11" fill="#5b21b6">GET /api/ping · POST /api/exec (argv, allow-list)</text>
  <line x1="250" y1="162" x2="316" y2="162" stroke="#334155" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="250" y1="250" x2="316" y2="250" stroke="#334155" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="695" y1="336" x2="748" y2="176" stroke="#334155" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="700" y="268" text-anchor="middle" font-size="10.5" fill="#475569">ssh</text>
  <line x1="700" y1="336" x2="748" y2="618" stroke="#9333ea" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrU)"/>
  <text x="714" y="500" text-anchor="middle" font-size="10.5" fill="#9333ea">https</text>
  <text x="20" y="700" text-anchor="start" font-size="11.5" fill="#64748b">Security model: no string interpolation into a shell — the hub only ever sends argv lists, validated before they leave the process.</text>
</svg>
