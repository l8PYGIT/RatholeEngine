<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 444" width="1200" height="444" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fc"/>
      <stop offset="52%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e8f1ff"/>
    </linearGradient>
    <radialGradient id="orbA" cx="20%" cy="15%" r="55%">
      <stop offset="0%" stop-color="rgba(124,58,237,0.11)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <radialGradient id="orbB" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="rgba(0,122,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="rgba(71,85,105,0.10)"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#059669"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="444" rx="18" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="444" rx="18" fill="url(#orbA)"/>
  <rect x="0" y="0" width="1200" height="444" rx="18" fill="url(#orbB)"/>
  <rect x="0" y="0" width="1200" height="444" rx="18" fill="url(#dotGrid)"/>
  <rect x="20" y="16" width="1160" height="66" rx="14" fill="rgba(255,255,255,0.86)" stroke="rgba(15,23,42,0.11)" stroke-width="1.2"/>
  <text x="600.0" y="41" text-anchor="middle" fill="#0f172a" font-size="18.5" font-weight="700">Central Principle: State -&gt; Regenerate -&gt; Validate -&gt; Hot-Reload</text>
  <text x="600.0" y="62" text-anchor="middle" fill="#475569" font-size="12.5">Never hand-edit generated configs — mutate state safely, commit in place, validate nginx, then reload.</text>
  <rect x="1108" y="27" width="56" height="22" rx="11" fill="rgba(0,122,255,0.11)" stroke="rgba(0,122,255,0.30)" stroke-width="1"/>
  <text x="1136" y="42" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="700">v2.1.0</text>
  <rect x="28" y="102" width="266" height="134" rx="14" fill="rgba(255,255,255,0.72)" stroke="#007aff" stroke-opacity="0.45" stroke-width="1.3"/>
  <rect x="38" y="112" width="246" height="114" rx="11" fill="#ffffff" stroke="#007aff" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="52" y="134" text-anchor="start" font-size="12" font-weight="700" fill="#0c4a6e">1 · Mutate State</text>
  <text x="52" y="153" text-anchor="start" font-size="11" fill="#1d4ed8">ratholectl: state_jq atomic write</text>
  <text x="52" y="170" text-anchor="start" font-size="11" fill="#1d4ed8">to state.json (single source)</text>
  <text x="52" y="187" text-anchor="start" font-size="11" fill="#1d4ed8">ratholenode: node.env +</text>
  <text x="52" y="204" text-anchor="start" font-size="11" fill="#1d4ed8">services.conf / bh-services.conf</text>
  <line x1="296" y1="169" x2="314" y2="169" stroke="#0284c7" stroke-width="2.4" marker-end="url(#arr)"/>
  <rect x="320" y="102" width="266" height="134" rx="14" fill="rgba(255,255,255,0.72)" stroke="#007aff" stroke-opacity="0.45" stroke-width="1.3"/>
  <rect x="330" y="112" width="246" height="114" rx="11" fill="#ffffff" stroke="#007aff" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="344" y="134" text-anchor="start" font-size="12" font-weight="700" fill="#0c4a6e">2 · Regenerate</text>
  <text x="344" y="153" text-anchor="start" font-size="11" fill="#1d4ed8">gen_server_toml() / gen_nginx_conf()</text>
  <text x="344" y="170" text-anchor="start" font-size="11" fill="#1d4ed8">gen_client() / backhaul TOML</text>
  <text x="344" y="187" text-anchor="start" font-size="11" fill="#1d4ed8">rth_commit_config(): flock +</text>
  <text x="344" y="204" text-anchor="start" font-size="11" fill="#1d4ed8">cat tmp &gt; file (inode preserved!)</text>
  <line x1="588" y1="169" x2="606" y2="169" stroke="#0284c7" stroke-width="2.4" marker-end="url(#arr)"/>
  <rect x="612" y="102" width="266" height="134" rx="14" fill="rgba(255,255,255,0.72)" stroke="#d97706" stroke-opacity="0.45" stroke-width="1.3"/>
  <rect x="622" y="112" width="246" height="114" rx="11" fill="#ffffff" stroke="#d97706" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="636" y="134" text-anchor="start" font-size="12" font-weight="700" fill="#78350f">3 · Validate Gate</text>
  <text x="636" y="153" text-anchor="start" font-size="11" fill="#b45309">Snapshot known-good config to</text>
  <text x="636" y="170" text-anchor="start" font-size="11" fill="#b45309">.rathole-good.bak BEFORE apply</text>
  <text x="636" y="187" text-anchor="start" font-size="11" fill="#b45309">Run nginx -t (http + stream)</text>
  <text x="636" y="204" text-anchor="start" font-size="11" fill="#b45309">Stop immediately if validation fails</text>
  <line x1="880" y1="169" x2="898" y2="169" stroke="#059669" stroke-width="2.4" marker-end="url(#arrG)"/>
  <rect x="904" y="102" width="266" height="134" rx="14" fill="rgba(255,255,255,0.72)" stroke="#059669" stroke-opacity="0.45" stroke-width="1.3"/>
  <rect x="914" y="112" width="246" height="114" rx="11" fill="#ffffff" stroke="#059669" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="928" y="134" text-anchor="start" font-size="12" font-weight="700" fill="#064e3b">4 · Hot-Reload</text>
  <text x="928" y="153" text-anchor="start" font-size="11" fill="#047857">systemctl reload nginx</text>
  <text x="928" y="170" text-anchor="start" font-size="11" fill="#047857">rathole config_watcher detects</text>
  <text x="928" y="187" text-anchor="start" font-size="11" fill="#047857">in-place write -&gt; zero drops</text>
  <text x="928" y="204" text-anchor="start" font-size="11" fill="#047857">Restart only if transport changed</text>
  <rect x="28" y="286" width="558" height="74" rx="11" fill="rgba(220,38,38,0.08)" stroke="#dc2626" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="307.0" y="308" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">Validation Failed -&gt; Auto-Revert (.rathole-good.bak)</text>
  <text x="307.0" y="327" text-anchor="middle" font-size="11" fill="#b91c1c">Restores both HTTP and Stream nginx configs + state before exit.</text>
  <text x="307.0" y="344" text-anchor="middle" font-size="11" fill="#b91c1c">Live reverse tunnels remain untouched and nginx never stays broken.</text>
  <rect x="614" y="286" width="558" height="74" rx="11" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="893.0" y="308" text-anchor="middle" font-size="12.5" font-weight="700" fill="#064e3b">Validation Passed -&gt; Active Tunnels Survive</text>
  <text x="893.0" y="327" text-anchor="middle" font-size="11" fill="#047857">Inode preservation keeps rathole config_watcher hot-reloading smoothly.</text>
  <text x="893.0" y="344" text-anchor="middle" font-size="11" fill="#047857">Applies identically across ws/kcp/plain/noise, Backhaul, FRP, GRE &amp; Agent.</text>
  <path d="M 745.0 236 L 745.0 262 L 460 262 L 460 282" fill="none" stroke="#dc2626" stroke-width="2.3" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <rect x="568.0" y="251.0" width="88" height="22" rx="11.0" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="568.0" y="251.0" width="88" height="22" rx="11.0" fill="rgba(220,38,38,0.08)"/>
  <text x="612" y="265.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7f1d1d">fail -&gt; revert</text>
  <line x1="1037.0" y1="236" x2="1037.0" y2="282" stroke="#059669" stroke-width="2.4" marker-end="url(#arrG)"/>
  <rect x="1010.0" y="248.0" width="54" height="22" rx="11.0" fill="#ffffff" stroke="#059669" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="1010.0" y="248.0" width="54" height="22" rx="11.0" fill="rgba(5,150,105,0.08)"/>
  <text x="1037.0" y="262.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#064e3b">pass</text>
  <text x="28" y="414" text-anchor="start" font-size="11" font-weight="500" fill="#64748b">Why rth_commit_config uses 'cat tmp &gt; dst' instead of 'mv': mv replaces the file inode and breaks inotify/config_watcher.</text>
</svg>
