<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrU" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="560" fill="#ffffff"/>
  <rect x="20" y="16" width="1120" height="60" rx="8" fill="#0f172a"/>
  <text x="580" y="39" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">Central design principle: state → regenerate → hot-reload</text>
  <text x="580" y="59" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Never hand-edit a generated config — mutate state, regenerate, validate, reload.</text>
  <rect x="20" y="100" width="250" height="210" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="145" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">1 · mutate state</text>
  <text x="40" y="156" text-anchor="start" font-size="11" fill="#334155">ratholectl: state.json (jq)</text>
  <text x="40" y="176" text-anchor="start" font-size="11" fill="#334155">ratholenode: node.env +</text>
  <text x="40" y="196" text-anchor="start" font-size="11" fill="#334155">services.conf + bh-services.conf</text>
  <text x="40" y="216" text-anchor="start" font-size="11" fill="#334155">the single source of truth</text>
  <line x1="270" y1="205" x2="308" y2="205" stroke="#334155" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="310" y="100" width="250" height="210" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="435" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">2 · regenerate()</text>
  <text x="330" y="156" text-anchor="start" font-size="11" fill="#334155">gen_server_toml()</text>
  <text x="330" y="176" text-anchor="start" font-size="11" fill="#334155">gen_nginx_conf() (+ stream/SNI)</text>
  <text x="330" y="196" text-anchor="start" font-size="11" fill="#334155">gen_client() / gen_backhaul_client_toml()</text>
  <text x="330" y="216" text-anchor="start" font-size="11" fill="#334155">write .tmp → cat &gt; file (inode kept)</text>
  <line x1="560" y1="205" x2="598" y2="205" stroke="#334155" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="600" y="100" width="250" height="210" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="725" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a8a">3 · validate</text>
  <text x="620" y="156" text-anchor="start" font-size="11" fill="#334155">nginx -t (http + stream)</text>
  <text x="620" y="176" text-anchor="start" font-size="11" fill="#334155">snapshot known-good first</text>
  <text x="620" y="196" text-anchor="start" font-size="11" fill="#334155">gate before touching live nginx</text>
  <line x1="850" y1="205" x2="888" y2="205" stroke="#334155" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="890" y="100" width="250" height="210" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1015" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">4 · hot-reload</text>
  <text x="910" y="156" text-anchor="start" font-size="11" fill="#334155">systemctl reload nginx</text>
  <text x="910" y="176" text-anchor="start" font-size="11" fill="#334155">rathole config_watcher re-reads</text>
  <text x="910" y="196" text-anchor="start" font-size="11" fill="#334155">tunnels stay up</text>
  <text x="910" y="216" text-anchor="start" font-size="11" fill="#334155">restart only for transport changes</text>
  <line x1="880" y1="310" x2="880" y2="366" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="20" y="348" width="540" height="92" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="290" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">fail · 4′ auto-revert</text>
  <text x="40" y="398" text-anchor="start" font-size="11" fill="#991b1b">restore http AND stream conf from the pre-regen snapshot /</text>
  <text x="40" y="418" text-anchor="start" font-size="11" fill="#991b1b">.rathole-good.bak — nginx never stays broken</text>
  <rect x="600" y="348" width="540" height="92" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="870" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#14532d">pass · active tunnels survive</text>
  <text x="620" y="398" text-anchor="start" font-size="11" fill="#166534">config_watcher re-reads server.toml in place (inode preserved);</text>
  <text x="620" y="418" text-anchor="start" font-size="11" fill="#166534">the node prefers hot-reload and only restarts for kcp / noise</text>
  <text x="20" y="500" text-anchor="start" font-size="11.5" fill="#64748b">Same pattern for every lane: rathole (ws/kcp/plain/noise), Backhaul (bh-services.conf), FRP (frps.toml), GRE (ip tunnel), and the REST agent (rathole-agent.service).</text>
</svg>
