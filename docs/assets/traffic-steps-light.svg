  <rect x="566" y="324" width="370" height="48" rx="11" fill="#ffffff" stroke="#059669" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="751.0" y="346" text-anchor="middle" font-size="11.5" font-weight="700" fill="#064e3b">VLESS  -&gt;  User Traffic</text>
  <text x="751.0" y="365" text-anchor="middle" font-size="11" fill="#047857">Decrypted ONLY by Xray on the node</text>
  <text x="610" y="430" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Nginx and rathole never inspect or decrypt VLESS payloads inside the WebSocket tunnel.</text>
