  <rect x="0" y="0" width="1200" height="814" rx="18" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="814" rx="18" fill="url(#orbA)"/>
  <rect x="0" y="0" width="1200" height="814" rx="18" fill="url(#orbB)"/>
  <rect x="0" y="0" width="1200" height="814" rx="18" fill="url(#dotGrid)"/>
  <rect x="20" y="16" width="1160" height="66" rx="14" fill="rgba(255,255,255,0.86)" stroke="rgba(15,23,42,0.11)" stroke-width="1.2"/>
  <text x="600.0" y="41" text-anchor="middle" fill="#0f172a" font-size="18.5" font-weight="700">Transport &amp; Ingress Modes — 9 Carriers, 4 Edge / Ingress Modes</text>
  <text x="600.0" y="62" text-anchor="middle" fill="#475569" font-size="12.5">User URL paths and node inbound ports stay stable across all 9 tunnel carriers and Auto-Bench tuning.</text>
  <rect x="1108" y="27" width="56" height="22" rx="11" fill="rgba(0,122,255,0.11)" stroke="rgba(0,122,255,0.30)" stroke-width="1"/>
  <text x="1136" y="42" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="700">v2.3.0</text>
  <rect x="24" y="100" width="568" height="96" rx="12" fill="#ffffff" stroke="#059669" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="38.0" y="111.0" width="168" height="24" rx="12.0" fill="#ffffff" stroke="#059669" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="38.0" y="111.0" width="168" height="24" rx="12.0" fill="rgba(5,150,105,0.08)"/>
  <text x="122.0" y="126.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#064e3b">1 · WebSocket + TLS</text>
  <text x="576" y="127" text-anchor="end" font-size="10" font-weight="700" fill="#047857">DEFAULT · RATHOLE</text>
  <text x="42" y="155" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">wss://domain:443 -&gt; Nginx TLS -&gt; control /_rh/&lt;hex&gt; :2333</text>
  <text x="42" y="177" text-anchor="start" font-size="10.5" font-weight="500" fill="#64748b">Server stays tls = false; traffic blends with HTTPS on :443.</text>
  <rect x="608" y="100" width="568" height="96" rx="12" fill="#ffffff" stroke="#007aff" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="622.0" y="111.0" width="168" height="24" rx="12.0" fill="#ffffff" stroke="#007aff" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="622.0" y="111.0" width="168" height="24" rx="12.0" fill="rgba(0,122,255,0.08)"/>
  <text x="706.0" y="126.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0c4a6e">2 · KCP (UDP + FEC)</text>
  <text x="1160" y="127" text-anchor="end" font-size="10" font-weight="700" fill="#1d4ed8">LOSSY LINKS · QUIC-LIKE</text>
  <text x="626" y="155" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">kcptun client :29901.. -&gt; UDP :443 -&gt; rathole :2333</text>
  <text x="626" y="177" text-anchor="start" font-size="10.5" font-weight="500" fill="#64748b">Profiles balanced/lossy/aggressive; immune to TCP-over-TCP.</text>
  <rect x="24" y="208" width="568" height="96" rx="12" fill="#ffffff" stroke="#d97706" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="38.0" y="219.0" width="168" height="24" rx="12.0" fill="#ffffff" stroke="#d97706" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="38.0" y="219.0" width="168" height="24" rx="12.0" fill="rgba(217,119,6,0.08)"/>
  <text x="122.0" y="234.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#78350f">3 · Plain WebSocket</text>
  <text x="576" y="235" text-anchor="end" font-size="10" font-weight="700" fill="#b45309">NO-TLS HTTP · OPT-IN</text>
  <text x="42" y="263" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">http://domain:8880 -&gt; Nginx HTTP -&gt; control /_rh/&lt;hex&gt;</text>
  <text x="42" y="285" text-anchor="start" font-size="10.5" font-weight="500" fill="#64748b">Lighter transport without TLS overhead (explicit opt-in).</text>
  <rect x="608" y="208" width="568" height="96" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="622.0" y="219.0" width="168" height="24" rx="12.0" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="622.0" y="219.0" width="168" height="24" rx="12.0" fill="rgba(124,58,237,0.08)"/>
  <text x="706.0" y="234.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4c1d95">4 · Noise (X25519)</text>
  <text x="1160" y="235" text-anchor="end" font-size="10" font-weight="700" fill="#6d28d9">ENCRYPTED · NO CERT</text>
  <text x="626" y="263" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">rathole-noise client -&gt; TCP :2334 rathole-noise server</text>
  <text x="626" y="285" text-anchor="start" font-size="10.5" font-weight="500" fill="#64748b">Dedicated encrypted instance; bypasses Nginx completely.</text>
  <rect x="24" y="316" width="568" height="96" rx="12" fill="#ffffff" stroke="#059669" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="38.0" y="327.0" width="168" height="24" rx="12.0" fill="#ffffff" stroke="#059669" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="38.0" y="327.0" width="168" height="24" rx="12.0" fill="rgba(5,150,105,0.08)"/>
  <text x="122.0" y="342.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#064e3b">5 · Backhaul (SMUX)</text>
  <text x="576" y="343" text-anchor="end" font-size="10" font-weight="700" fill="#047857">DUAL-CORE · HIGH CONCURRENCY</text>
  <text x="42" y="371" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">wss/wssmux -&gt; Nginx /channel + /tunnel -&gt; 127.0.0.1:3080</text>
  <text x="42" y="393" text-anchor="start" font-size="10.5" font-weight="500" fill="#64748b">Go core w/ uTLS Chrome fingerprint &amp; pinned direct-IP TLS.</text>
  <rect x="608" y="316" width="568" height="96" rx="12" fill="#ffffff" stroke="#d97706" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="622.0" y="327.0" width="196" height="24" rx="12.0" fill="#ffffff" stroke="#d97706" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="622.0" y="327.0" width="196" height="24" rx="12.0" fill="rgba(217,119,6,0.08)"/>
  <text x="720.0" y="342.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#78350f">6 · FRP Core (fatedier/frp)</text>
  <text x="1160" y="343" text-anchor="end" font-size="10" font-weight="700" fill="#b45309">TCP · KCP · QUIC · WS</text>
  <text x="626" y="371" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">frpc -&gt; frps :7000/TCP (tcp/ws) + :7000/UDP (kcp/quic)</text>
  <text x="626" y="393" text-anchor="start" font-size="10.5" font-weight="500" fill="#64748b">Preserves selected frp_transport &amp; auto-opens UFW UDP.</text>
  <rect x="24" y="424" width="568" height="96" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="38.0" y="435.0" width="168" height="24" rx="12.0" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="38.0" y="435.0" width="168" height="24" rx="12.0" fill="rgba(124,58,237,0.08)"/>
  <text x="122.0" y="450.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4c1d95">7 · GRE (Kernel L3)</text>
  <text x="576" y="451" text-anchor="end" font-size="10" font-weight="700" fill="#6d28d9">IP TUNNEL · PROTO 47</text>
  <text x="42" y="479" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">Node 10.10.10.2/30 &lt;-&gt; Iran 10.10.10.1/30 (gre1 --key N)</text>
  <text x="42" y="501" text-anchor="start" font-size="10.5" font-weight="500" fill="#64748b">Direct Linux kernel L3 link with configurable MTU &amp; TCPMSS.</text>
  <rect x="608" y="424" width="568" height="96" rx="12" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="622.0" y="435.0" width="168" height="24" rx="12.0" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="622.0" y="435.0" width="168" height="24" rx="12.0" fill="rgba(220,38,38,0.08)"/>
  <text x="706.0" y="450.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7f1d1d">8 · FRP + GRE Hybrid</text>
  <text x="1160" y="451" text-anchor="end" font-size="10" font-weight="700" fill="#b91c1c">RESILIENT L3 + MUX</text>
  <text x="626" y="479" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">frpc over GRE IP -&gt; frps bound inside 10.10.10.0/30</text>
  <text x="626" y="501" text-anchor="start" font-size="10.5" font-weight="500" fill="#64748b">No public FRP port exposed; QUIC/KCP mux inside GRE packets.</text>
  <rect x="24" y="532" width="568" height="96" rx="12" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="38.0" y="543.0" width="168" height="24" rx="12.0" fill="#ffffff" stroke="#dc2626" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="38.0" y="543.0" width="168" height="24" rx="12.0" fill="rgba(220,38,38,0.08)"/>
  <text x="122.0" y="558.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7f1d1d">9 · Paqet (Direct PCK)</text>
  <text x="576" y="559" text-anchor="end" font-size="10" font-weight="700" fill="#b91c1c">RAW TCP+KCP · NO TLS</text>
  <text x="42" y="587" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">paqet client (Iran) -&gt; raw TCP+KCP -&gt; paqet server (Node)</text>
  <text x="42" y="609" text-anchor="start" font-size="10.5" font-weight="500" fill="#64748b">Zero TLS handshake; CAP_NET_RAW + iptables RAW NOTRACK.</text>
  <rect x="608" y="532" width="568" height="96" rx="12" fill="#ffffff" stroke="#007aff" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="622.0" y="543.0" width="171" height="24" rx="12.0" fill="#ffffff" stroke="#007aff" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="622.0" y="543.0" width="171" height="24" rx="12.0" fill="rgba(0,122,255,0.08)"/>
  <text x="707.5" y="558.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0c4a6e">10 · Auto-Bench (Tuner)</text>
  <text x="1160" y="559" text-anchor="end" font-size="10" font-weight="700" fill="#1d4ed8">6-STAGE SWEEP · rthprof1:</text>
  <text x="626" y="587" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">PMTU/MSS · Offloads · BBR/CAKE · Buffers · Carrier Matrix</text>
  <text x="626" y="609" text-anchor="start" font-size="10.5" font-weight="500" fill="#64748b">5D weighted scoring + AI-portable JSON &amp; rthprof1: profiles.</text>
  <rect x="24" y="644" width="1152" height="148" rx="14" fill="rgba(255,255,255,0.72)" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="40" y="666" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#1e293b">EDGE &amp; USER INGRESS MODES (NOT TUNNEL CARRIERS)</text>
  <rect x="40" y="680" width="269" height="74" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="174.5" y="702" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">Managed Xray</text>
  <text x="174.5" y="721" text-anchor="middle" font-size="11" fill="#6d28d9">VLESS REALITY + XHTTP</text>
  <text x="174.5" y="738" text-anchor="middle" font-size="11" fill="#6d28d9">TLS 1.3 + h2 Cover Scanner</text>
  <rect x="323" y="680" width="269" height="74" rx="11" fill="#ffffff" stroke="#007aff" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="457.5" y="702" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0c4a6e">Game / SNI (L4)</text>
  <text x="457.5" y="721" text-anchor="middle" font-size="11" fill="#1d4ed8">Nginx stream :443 raw TLS</text>
  <text x="457.5" y="738" text-anchor="middle" font-size="11" fill="#1d4ed8">Cert + Vision + PROXY proto</text>
  <rect x="606" y="680" width="269" height="74" rx="11" fill="#ffffff" stroke="#007aff" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="740.5" y="702" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0c4a6e">Direct-IP (:8081 HTTP)</text>
  <text x="740.5" y="721" text-anchor="middle" font-size="11" fill="#1d4ed8">Direct to Iran IP (no domain)</text>
  <text x="740.5" y="738" text-anchor="middle" font-size="11" fill="#1d4ed8">Hidden X-Cdn-Id header</text>
  <rect x="889" y="680" width="269" height="74" rx="11" fill="#ffffff" stroke="#64748b" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="1023.5" y="702" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">Proxy &amp; Fakeweb</text>
  <text x="1023.5" y="721" text-anchor="middle" font-size="11" fill="#475569">/&lt;name&gt;/ reverse-proxy</text>
  <text x="1023.5" y="738" text-anchor="middle" font-size="11" fill="#475569">Decoy fallback site :8080</text>
</svg>
