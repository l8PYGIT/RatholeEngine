<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 814" width="1200" height="814" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fc"/>
      <stop offset="52%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e8f1ff"/>
    </linearGradient>
    <radialGradient id="orbA" cx="20%" cy="15%" r="55%">
      <stop offset="0%" stop-color="rgba(124,58,237,0.11)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
