  <text x="580" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">IRAN ENTRY / CORE</text>
  <text x="1000" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#475569">TLS TERMINATION</text>
