<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 814" width="1200" height="814" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b16"/>
      <stop offset="52%" stop-color="#0d1528"/>
      <stop offset="100%" stop-color="#121c36"/>
    </linearGradient>
    <radialGradient id="orbA" cx="20%" cy="15%" r="55%">
      <stop offset="0%" stop-color="rgba(124,58,237,0.22)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <radialGradient id="orbB" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="rgba(10,132,255,0.20)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="rgba(148,163,184,0.13)"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#34d399"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#fb7185"/>
    </marker>
    <marker id="arrN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="814" rx="18" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="814" rx="18" fill="url(#orbA)"/>
  <rect x="0" y="0" width="1200" height="814" rx="18" fill="url(#orbB)"/>
  <rect x="0" y="0" width="1200" height="814" rx="18" fill="url(#dotGrid)"/>
  <rect x="20" y="16" width="1160" height="66" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.13)" stroke-width="1.2"/>
  <text x="600.0" y="41" text-anchor="middle" fill="#f8fafc" font-size="18.5" font-weight="700">Transport &amp; Ingress Modes — 9 Carriers, 4 Edge / Ingress Modes</text>
  <text x="600.0" y="62" text-anchor="middle" fill="#94a3b8" font-size="12.5">User URL paths and node inbound ports stay stable across all 9 tunnel carriers and Auto-Bench tuning.</text>
  <rect x="1108" y="27" width="56" height="22" rx="11" fill="rgba(10,132,255,0.20)" stroke="rgba(56,189,248,0.45)" stroke-width="1"/>
  <text x="1136" y="42" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700">v2.3.0</text>
  <rect x="24" y="100" width="568" height="96" rx="12" fill="#0f192e" stroke="#34d399" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="38.0" y="111.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#34d399" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="38.0" y="111.0" width="168" height="24" rx="12.0" fill="rgba(16,185,129,0.12)"/>
  <text x="122.0" y="126.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#d1fae5">1 · WebSocket + TLS</text>
  <text x="576" y="127" text-anchor="end" font-size="10" font-weight="700" fill="#86efac">DEFAULT · RATHOLE</text>
  <text x="42" y="155" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">wss://domain:443 -&gt; Nginx TLS -&gt; control /_rh/&lt;hex&gt; :2333</text>
  <text x="42" y="177" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">Server stays tls = false; traffic blends with HTTPS on :443.</text>
  <rect x="608" y="100" width="568" height="96" rx="12" fill="#0f192e" stroke="#38bdf8" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="622.0" y="111.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="622.0" y="111.0" width="168" height="24" rx="12.0" fill="rgba(10,132,255,0.12)"/>
  <text x="706.0" y="126.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e0f2fe">2 · KCP (UDP + FEC)</text>
  <text x="1160" y="127" text-anchor="end" font-size="10" font-weight="700" fill="#93c5fd">LOSSY LINKS · QUIC-LIKE</text>
  <text x="626" y="155" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">kcptun client :29901.. -&gt; UDP :443 -&gt; rathole :2333</text>
  <text x="626" y="177" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">Profiles balanced/lossy/aggressive; immune to TCP-over-TCP.</text>
  <rect x="24" y="208" width="568" height="96" rx="12" fill="#0f192e" stroke="#fbbf24" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="38.0" y="219.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#fbbf24" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="38.0" y="219.0" width="168" height="24" rx="12.0" fill="rgba(245,158,11,0.12)"/>
  <text x="122.0" y="234.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fef3c7">3 · Plain WebSocket</text>
  <text x="576" y="235" text-anchor="end" font-size="10" font-weight="700" fill="#fcd34d">NO-TLS HTTP · OPT-IN</text>
  <text x="42" y="263" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">http://domain:8880 -&gt; Nginx HTTP -&gt; control /_rh/&lt;hex&gt;</text>
  <text x="42" y="285" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">Lighter transport without TLS overhead (explicit opt-in).</text>
  <rect x="608" y="208" width="568" height="96" rx="12" fill="#0f192e" stroke="#a78bfa" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="622.0" y="219.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#a78bfa" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="622.0" y="219.0" width="168" height="24" rx="12.0" fill="rgba(124,58,237,0.14)"/>
  <text x="706.0" y="234.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ede9fe">4 · Noise (X25519)</text>
  <text x="1160" y="235" text-anchor="end" font-size="10" font-weight="700" fill="#c4b5fd">ENCRYPTED · NO CERT</text>
  <text x="626" y="263" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">rathole-noise client -&gt; TCP :2334 rathole-noise server</text>
  <text x="626" y="285" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">Dedicated encrypted instance; bypasses Nginx completely.</text>
  <rect x="24" y="316" width="568" height="96" rx="12" fill="#0f192e" stroke="#34d399" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="38.0" y="327.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#34d399" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="38.0" y="327.0" width="168" height="24" rx="12.0" fill="rgba(16,185,129,0.12)"/>
  <text x="122.0" y="342.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#d1fae5">5 · Backhaul (SMUX)</text>
  <text x="576" y="343" text-anchor="end" font-size="10" font-weight="700" fill="#86efac">DUAL-CORE · HIGH CONCURRENCY</text>
  <text x="42" y="371" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">wss/wssmux -&gt; Nginx /channel + /tunnel -&gt; 127.0.0.1:3080</text>
  <text x="42" y="393" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">Go core w/ uTLS Chrome fingerprint &amp; pinned direct-IP TLS.</text>
  <rect x="608" y="316" width="568" height="96" rx="12" fill="#0f192e" stroke="#fbbf24" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="622.0" y="327.0" width="196" height="24" rx="12.0" fill="#0b1324" stroke="#fbbf24" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="622.0" y="327.0" width="196" height="24" rx="12.0" fill="rgba(245,158,11,0.12)"/>
  <text x="720.0" y="342.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fef3c7">6 · FRP Core (fatedier/frp)</text>
  <text x="1160" y="343" text-anchor="end" font-size="10" font-weight="700" fill="#fcd34d">TCP · KCP · QUIC · WS</text>
  <text x="626" y="371" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">frpc -&gt; frps :7000/TCP (tcp/ws) + :7000/UDP (kcp/quic)</text>
  <text x="626" y="393" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">Preserves selected frp_transport &amp; auto-opens UFW UDP.</text>
  <rect x="24" y="424" width="568" height="96" rx="12" fill="#0f192e" stroke="#a78bfa" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="38.0" y="435.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#a78bfa" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="38.0" y="435.0" width="168" height="24" rx="12.0" fill="rgba(124,58,237,0.14)"/>
  <text x="122.0" y="450.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ede9fe">7 · GRE (Kernel L3)</text>
  <text x="576" y="451" text-anchor="end" font-size="10" font-weight="700" fill="#c4b5fd">IP TUNNEL · PROTO 47</text>
  <text x="42" y="479" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">Node 10.10.10.2/30 &lt;-&gt; Iran 10.10.10.1/30 (gre1 --key N)</text>
  <text x="42" y="501" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">Direct Linux kernel L3 link with configurable MTU &amp; TCPMSS.</text>
  <rect x="608" y="424" width="568" height="96" rx="12" fill="#0f192e" stroke="#fb7185" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="622.0" y="435.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#fb7185" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="622.0" y="435.0" width="168" height="24" rx="12.0" fill="rgba(244,63,94,0.12)"/>
  <text x="706.0" y="450.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffe4e6">8 · FRP + GRE Hybrid</text>
  <text x="1160" y="451" text-anchor="end" font-size="10" font-weight="700" fill="#fda4af">RESILIENT L3 + MUX</text>
  <text x="626" y="479" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">frpc over GRE IP -&gt; frps bound inside 10.10.10.0/30</text>
  <text x="626" y="501" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">No public FRP port exposed; QUIC/KCP mux inside GRE packets.</text>
  <rect x="24" y="532" width="568" height="96" rx="12" fill="#0f192e" stroke="#fb7185" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="38.0" y="543.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#fb7185" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="38.0" y="543.0" width="168" height="24" rx="12.0" fill="rgba(244,63,94,0.12)"/>
  <text x="122.0" y="558.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffe4e6">9 · Paqet (Direct PCK)</text>
  <text x="576" y="559" text-anchor="end" font-size="10" font-weight="700" fill="#fda4af">RAW TCP+KCP · NO TLS</text>
  <text x="42" y="587" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">paqet client (Iran) -&gt; raw TCP+KCP -&gt; paqet server (Node)</text>
  <text x="42" y="609" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">Zero TLS handshake; CAP_NET_RAW + iptables RAW NOTRACK.</text>
  <rect x="608" y="532" width="568" height="96" rx="12" fill="#0f192e" stroke="#38bdf8" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="622.0" y="543.0" width="171" height="24" rx="12.0" fill="#0b1324" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="622.0" y="543.0" width="171" height="24" rx="12.0" fill="rgba(10,132,255,0.12)"/>
  <text x="707.5" y="558.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e0f2fe">10 · Auto-Bench (Tuner)</text>
  <text x="1160" y="559" text-anchor="end" font-size="10" font-weight="700" fill="#93c5fd">6-STAGE SWEEP · rthprof1:</text>
  <text x="626" y="587" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">PMTU/MSS · Offloads · BBR/CAKE · Buffers · Carrier Matrix</text>
  <text x="626" y="609" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">5D weighted scoring + AI-portable JSON &amp; rthprof1: profiles.</text>
  <rect x="24" y="644" width="1152" height="148" rx="14" fill="rgba(15,23,42,0.58)" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="40" y="666" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#f1f5f9">EDGE &amp; USER INGRESS MODES (NOT TUNNEL CARRIERS)</text>
  <rect x="40" y="680" width="269" height="74" rx="11" fill="#0f192e" stroke="#a78bfa" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="174.5" y="702" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ede9fe">Managed Xray</text>
  <text x="174.5" y="721" text-anchor="middle" font-size="11" fill="#c4b5fd">VLESS REALITY + XHTTP</text>
  <text x="174.5" y="738" text-anchor="middle" font-size="11" fill="#c4b5fd">TLS 1.3 + h2 Cover Scanner</text>
  <rect x="323" y="680" width="269" height="74" rx="11" fill="#0f192e" stroke="#38bdf8" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="457.5" y="702" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e0f2fe">Game / SNI (L4)</text>
  <text x="457.5" y="721" text-anchor="middle" font-size="11" fill="#93c5fd">Nginx stream :443 raw TLS</text>
  <text x="457.5" y="738" text-anchor="middle" font-size="11" fill="#93c5fd">Cert + Vision + PROXY proto</text>
  <rect x="606" y="680" width="269" height="74" rx="11" fill="#0f192e" stroke="#38bdf8" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="740.5" y="702" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e0f2fe">Direct-IP (:8081 HTTP)</text>
  <text x="740.5" y="721" text-anchor="middle" font-size="11" fill="#93c5fd">Direct to Iran IP (no domain)</text>
  <text x="740.5" y="738" text-anchor="middle" font-size="11" fill="#93c5fd">Hidden X-Cdn-Id header</text>
  <rect x="889" y="680" width="269" height="74" rx="11" fill="#0f192e" stroke="#64748b" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="1023.5" y="702" text-anchor="middle" font-size="11.5" font-weight="700" fill="#f1f5f9">Proxy &amp; Fakeweb</text>
  <text x="1023.5" y="721" text-anchor="middle" font-size="11" fill="#cbd5e1">/&lt;name&gt;/ reverse-proxy</text>
  <text x="1023.5" y="738" text-anchor="middle" font-size="11" fill="#cbd5e1">Decoy fallback site :8080</text>
</svg>
