  <text x="580" y="39" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">Transport &amp; ingress modes — 8 carriers, 3 ingress modes</text>
  <text x="580" y="59" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Services, tokens and user paths never change — only the lane that carries the tunnel does.</text>
