<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b16"/>
      <stop offset="52%" stop-color="#0d1528"/>
      <stop offset="100%" stop-color="#121c36"/>
    </linearGradient>
    <radialGradient id="orbA" cx="20%" cy="15%" r="55%">
      <stop offset="0%" stop-color="rgba(124,58,237,0.22)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <radialGradient id="orbB" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="rgba(10,132,255,0.20)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="rgba(148,163,184,0.13)"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#34d399"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#fb7185"/>
    </marker>
    <marker id="arrN" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="740" rx="18" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="740" rx="18" fill="url(#orbA)"/>
  <rect x="0" y="0" width="1200" height="740" rx="18" fill="url(#orbB)"/>
  <rect x="0" y="0" width="1200" height="740" rx="18" fill="url(#dotGrid)"/>
  <rect x="20" y="16" width="1160" height="66" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.13)" stroke-width="1.2"/>
  <text x="600.0" y="41" text-anchor="middle" fill="#f8fafc" font-size="18.5" font-weight="700">Transport &amp; Ingress Modes — 8 Carriers, 3 Ingress Modes</text>
  <text x="600.0" y="62" text-anchor="middle" fill="#94a3b8" font-size="12.5">User URL paths and node inbound ports never change when switching tunnel carriers.</text>
  <rect x="1108" y="27" width="56" height="22" rx="11" fill="rgba(10,132,255,0.20)" stroke="rgba(56,189,248,0.45)" stroke-width="1"/>
  <text x="1136" y="42" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700">v2.1.0</text>
  <rect x="24" y="100" width="568" height="104" rx="12" fill="#0f192e" stroke="#34d399" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="36.0" y="112.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#34d399" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="36.0" y="112.0" width="168" height="24" rx="12.0" fill="rgba(16,185,129,0.12)"/>
  <text x="120" y="127.5" text-anchor="middle" font-size="11" font-weight="700" fill="#d1fae5">1 · WebSocket + TLS</text>
  <text x="576" y="128" text-anchor="end" font-size="10" font-weight="700" fill="#86efac">DEFAULT · RATHOLE</text>
  <text x="42" y="158" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">wss://domain:443 -&gt; Nginx TLS -&gt; control /_rh/&lt;hex&gt; :2333</text>
  <text x="42" y="182" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">Server stays tls = false; traffic blends with HTTPS on :443.</text>
  <rect x="608" y="100" width="568" height="104" rx="12" fill="#0f192e" stroke="#38bdf8" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="620.0" y="112.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="620.0" y="112.0" width="168" height="24" rx="12.0" fill="rgba(10,132,255,0.12)"/>
  <text x="704" y="127.5" text-anchor="middle" font-size="11" font-weight="700" fill="#e0f2fe">2 · KCP (UDP + FEC)</text>
  <text x="1160" y="128" text-anchor="end" font-size="10" font-weight="700" fill="#93c5fd">LOSSY LINKS · QUIC-LIKE</text>
  <text x="626" y="158" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">kcptun client :29901.. -&gt; UDP :443 -&gt; rathole :2333</text>
  <text x="626" y="182" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">Profiles balanced/lossy/aggressive; immune to TCP-over-TCP.</text>
  <rect x="24" y="216" width="568" height="104" rx="12" fill="#0f192e" stroke="#fbbf24" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="36.0" y="228.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#fbbf24" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="36.0" y="228.0" width="168" height="24" rx="12.0" fill="rgba(245,158,11,0.12)"/>
  <text x="120" y="243.5" text-anchor="middle" font-size="11" font-weight="700" fill="#fef3c7">3 · Plain WebSocket</text>
  <text x="576" y="244" text-anchor="end" font-size="10" font-weight="700" fill="#fcd34d">NO-TLS HTTP · OPT-IN</text>
  <text x="42" y="274" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">http://domain:8880 -&gt; Nginx HTTP -&gt; control /_rh/&lt;hex&gt;</text>
  <text x="42" y="298" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">Lighter transport without TLS overhead (explicit opt-in).</text>
  <rect x="608" y="216" width="568" height="104" rx="12" fill="#0f192e" stroke="#a78bfa" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="620.0" y="228.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#a78bfa" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="620.0" y="228.0" width="168" height="24" rx="12.0" fill="rgba(124,58,237,0.14)"/>
  <text x="704" y="243.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ede9fe">4 · Noise (X25519)</text>
  <text x="1160" y="244" text-anchor="end" font-size="10" font-weight="700" fill="#c4b5fd">ENCRYPTED · NO CERT</text>
  <text x="626" y="274" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">rathole-noise client -&gt; TCP :2334 rathole-noise server</text>
  <text x="626" y="298" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">Dedicated encrypted instance; bypasses Nginx completely.</text>
  <rect x="24" y="332" width="568" height="104" rx="12" fill="#0f192e" stroke="#34d399" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="36.0" y="344.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#34d399" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="36.0" y="344.0" width="168" height="24" rx="12.0" fill="rgba(16,185,129,0.12)"/>
  <text x="120" y="359.5" text-anchor="middle" font-size="11" font-weight="700" fill="#d1fae5">5 · Backhaul (SMUX)</text>
  <text x="576" y="360" text-anchor="end" font-size="10" font-weight="700" fill="#86efac">DUAL-CORE · HIGH CONCURRENCY</text>
  <text x="42" y="390" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">wss/wssmux -&gt; Nginx /channel + /tunnel -&gt; 127.0.0.1:3080</text>
  <text x="42" y="414" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">Go core w/ uTLS Chrome fingerprint &amp; separate bh-services.conf.</text>
  <rect x="608" y="332" width="568" height="104" rx="12" fill="#0f192e" stroke="#fbbf24" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="620.0" y="344.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#fbbf24" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="620.0" y="344.0" width="168" height="24" rx="12.0" fill="rgba(245,158,11,0.12)"/>
  <text x="704" y="359.5" text-anchor="middle" font-size="11" font-weight="700" fill="#fef3c7">6 · FRP Core (fatedier/frp)</text>
  <text x="1160" y="360" text-anchor="end" font-size="10" font-weight="700" fill="#fcd34d">TCP · KCP · QUIC · WS</text>
  <text x="626" y="390" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">frpc -&gt; frps :7000/TCP (tcp/ws) + :7000/UDP (kcp/quic)</text>
  <text x="626" y="414" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">v2.0.5 preserves selected frp_transport &amp; auto-opens UFW UDP.</text>
  <rect x="24" y="448" width="568" height="104" rx="12" fill="#0f192e" stroke="#a78bfa" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="36.0" y="460.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#a78bfa" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="36.0" y="460.0" width="168" height="24" rx="12.0" fill="rgba(124,58,237,0.14)"/>
  <text x="120" y="475.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ede9fe">7 · GRE (Kernel L3)</text>
  <text x="576" y="476" text-anchor="end" font-size="10" font-weight="700" fill="#c4b5fd">IP TUNNEL · PROTO 47</text>
  <text x="42" y="506" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">Node 10.10.10.2/30 &lt;-&gt; Iran 10.10.10.1/30 (gre1)</text>
  <text x="42" y="530" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">Direct Linux kernel L3 link with MTU 1476 &amp; iptables TCPMSS.</text>
  <rect x="608" y="448" width="568" height="104" rx="12" fill="#0f192e" stroke="#fb7185" stroke-opacity="0.52" stroke-width="1.2"/>
  <rect x="620.0" y="460.0" width="168" height="24" rx="12.0" fill="#0b1324" stroke="#fb7185" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="620.0" y="460.0" width="168" height="24" rx="12.0" fill="rgba(244,63,94,0.12)"/>
  <text x="704" y="475.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ffe4e6">8 · FRP + GRE Hybrid</text>
  <text x="1160" y="476" text-anchor="end" font-size="10" font-weight="700" fill="#fda4af">RESILIENT L3 + MUX</text>
  <text x="626" y="506" text-anchor="start" font-size="11.5" font-weight="600" fill="#f1f5f9">frpc over GRE IP -&gt; frps bound inside 10.10.10.0/30</text>
  <text x="626" y="530" text-anchor="start" font-size="10.5" font-weight="500" fill="#94a3b8">No public FRP port exposed; QUIC/KCP mux inside GRE packets.</text>
  <rect x="24" y="568" width="1152" height="146" rx="14" fill="rgba(15,23,42,0.58)" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="40" y="590" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#f1f5f9">USER INGRESS MODES (NOT TUNNEL CARRIERS)</text>
  <rect x="42" y="604" width="360" height="74" rx="11" fill="#0f192e" stroke="#38bdf8" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="222.0" y="626" text-anchor="middle" font-size="12" font-weight="700" fill="#e0f2fe">Game / SNI (L4 Passthrough)</text>
  <text x="222.0" y="645" text-anchor="middle" font-size="11" fill="#93c5fd">Nginx stream on :443 passes TLS raw</text>
  <text x="222.0" y="662" text-anchor="middle" font-size="11" fill="#93c5fd">Cert + VLESS Vision live on node</text>
  <rect x="420" y="604" width="360" height="74" rx="11" fill="#0f192e" stroke="#38bdf8" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="600.0" y="626" text-anchor="middle" font-size="12" font-weight="700" fill="#e0f2fe">Direct-IP (:8081 HTTP)</text>
  <text x="600.0" y="645" text-anchor="middle" font-size="11" fill="#93c5fd">Connect directly to Iran IP (no domain)</text>
  <text x="600.0" y="662" text-anchor="middle" font-size="11" fill="#93c5fd">Hidden header X-Cdn-Id: &lt;node&gt; routes</text>
  <rect x="798" y="604" width="360" height="74" rx="11" fill="#0f192e" stroke="#64748b" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="978.0" y="626" text-anchor="middle" font-size="12" font-weight="700" fill="#f1f5f9">Proxy &amp; Fakeweb</text>
  <text x="978.0" y="645" text-anchor="middle" font-size="11" fill="#cbd5e1">/name/ reverse-proxy without rathole</text>
  <text x="978.0" y="662" text-anchor="middle" font-size="11" fill="#cbd5e1">Decoy site fallback served on :8080</text>
</svg>
