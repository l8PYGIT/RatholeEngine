  <rect x="0" y="0" width="1200" height="650" rx="18" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="650" rx="18" fill="url(#orbA)"/>
  <rect x="0" y="0" width="1200" height="650" rx="18" fill="url(#orbB)"/>
  <rect x="0" y="0" width="1200" height="650" rx="18" fill="url(#dotGrid)"/>
  <rect x="20" y="16" width="1160" height="66" rx="14" fill="rgba(255,255,255,0.86)" stroke="rgba(15,23,42,0.11)" stroke-width="1.2"/>
  <text x="600.0" y="41" text-anchor="middle" fill="#0f172a" font-size="18.5" font-weight="700">rathole-tuner — Ruthless Bidirectional Benchmark &amp; Auto-Tuner</text>
  <text x="600.0" y="62" text-anchor="middle" fill="#475569" font-size="12.5">6-stage kernel/MTU/MSS/offload/qdisc/carrier sweep · dead-man watchdog · portable AI profiles (rthprof1:)</text>
  <rect x="1108" y="27" width="56" height="22" rx="11" fill="rgba(0,122,255,0.11)" stroke="rgba(0,122,255,0.30)" stroke-width="1"/>
  <text x="1136" y="42" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="700">v2.3.0</text>
  <rect x="24" y="100" width="440" height="340" rx="14" fill="rgba(255,255,255,0.72)" stroke="#007aff" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="40" y="122" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#0c4a6e">ORCHESTRATOR — IRAN SERVER / HUB #/tuner</text>
  <rect x="42" y="134" width="404" height="90" rx="11" fill="#ffffff" stroke="#007aff" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="244.0" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">6-Stage Hardware &amp; Link Sweep</text>
  <text x="244.0" y="175" text-anchor="middle" font-size="11" fill="#1d4ed8">1. PMTU/MSS binary probe · 2. Offloads (TSO/GSO/GRO)</text>
  <text x="244.0" y="192" text-anchor="middle" font-size="11" fill="#1d4ed8">3. CC + Qdisc (BBR/CAKE/FQ) · 4. TCP/UDP rmem/wmem</text>
  <text x="244.0" y="209" text-anchor="middle" font-size="11" fill="#1d4ed8">5. Loaded Bufferbloat (RRUL) · 6. Carrier Matrix</text>
  <rect x="42" y="236" width="404" height="74" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="244.0" y="258" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4c1d95">5D Composite Weighted Scorer</text>
  <text x="244.0" y="277" text-anchor="middle" font-size="11" fill="#6d28d9">Goals: balanced · low-latency · max-throughput · anti-loss</text>
  <text x="244.0" y="294" text-anchor="middle" font-size="11" fill="#6d28d9">Throughput 30% · Latency 25% · Jitter 20% · Stab 15% · Eff 10%</text>
  <rect x="42" y="322" width="404" height="58" rx="11" fill="rgba(217,119,6,0.08)" stroke="#d97706" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="244.0" y="344" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f">Non-Kernel Audit &amp; Bottleneck Finder</text>
  <text x="244.0" y="363" text-anchor="middle" font-size="11" fill="#b45309">Checks Xray mux/sockopt/DNS · Nginx workers · OpenSSL AES · nofile</text>
  <text x="244" y="416" text-anchor="middle" font-size="10.5" font-weight="500" fill="#64748b">Auto-stops immediately on link loss via watchdog</text>
  <line x1="466" y1="200" x2="732" y2="200" stroke="#0284c7" stroke-width="2.4" marker-end="url(#arr)"/>
  <rect x="493.0" y="163.0" width="214" height="22" rx="11.0" fill="#ffffff" stroke="#007aff" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="493.0" y="163.0" width="214" height="22" rx="11.0" fill="rgba(0,122,255,0.08)"/>
  <text x="600" y="177.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0c4a6e">HMAC-SHA256 Control (:44990)</text>
  <line x1="466" y1="286" x2="732" y2="286" stroke="#7c3aed" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arrV)"/>
  <rect x="483.0" y="249.0" width="234" height="22" rx="11.0" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="483.0" y="249.0" width="234" height="22" rx="11.0" fill="rgba(124,58,237,0.08)"/>
  <text x="600" y="263.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4c1d95">Multi-Stream TCP/UDP + Loaded RTT</text>
  <line x1="734" y1="366" x2="468" y2="366" stroke="#059669" stroke-width="2.2" marker-end="url(#arrG)"/>
  <rect x="493.0" y="381.0" width="214" height="22" rx="11.0" fill="#ffffff" stroke="#059669" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="493.0" y="381.0" width="214" height="22" rx="11.0" fill="rgba(5,150,105,0.08)"/>
  <text x="600" y="395.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#064e3b">Telemetry + rthprof1: Output</text>
  <rect x="736" y="100" width="440" height="340" rx="14" fill="rgba(255,255,255,0.72)" stroke="#059669" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="752" y="122" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#064e3b">RESPONDER — FOREIGN NODE (EPHEMERAL)</text>
  <rect x="754" y="134" width="404" height="74" rx="11" fill="#ffffff" stroke="#059669" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="956.0" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">Zero-Footprint Responder</text>
  <text x="956.0" y="175" text-anchor="middle" font-size="11" fill="#047857">Starts only for test · closes after idle_sec finish</text>
  <text x="956.0" y="192" text-anchor="middle" font-size="11" fill="#047857">HMAC per-request nonces · zero persistent open port</text>
  <rect x="754" y="224" width="404" height="58" rx="11" fill="#ffffff" stroke="#64748b" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="956.0" y="246" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">Kernel Sysstate Snapshot (Before Any Change)</text>
  <text x="956.0" y="265" text-anchor="middle" font-size="11" fill="#475569">Saves sysctl, ip link mtu, tc qdisc &amp; ethtool -k flags</text>
  <rect x="754" y="298" width="404" height="74" rx="11" fill="rgba(220,38,38,0.08)" stroke="#dc2626" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="956.0" y="320" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7f1d1d">Dead-Man Watchdog + Safe Persist</text>
  <text x="956.0" y="339" text-anchor="middle" font-size="11" fill="#b91c1c">Auto-reverts to snapshot if peer heartbeat misses N sec</text>
  <text x="956.0" y="356" text-anchor="middle" font-size="11" fill="#b91c1c">Persists winner to /etc/sysctl.d/99-rathole-tuner.conf</text>
  <text x="956" y="416" text-anchor="middle" font-size="10.5" font-weight="500" fill="#64748b">Identical CLI on both sides: ratholectl|ratholenode bench</text>
  <rect x="24" y="462" width="1152" height="148" rx="14" fill="rgba(255,255,255,0.72)" stroke="#7c3aed" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="40" y="484" font-size="11" font-weight="700" letter-spacing="0.06em" fill="#4c1d95">PORTABLE AI PROFILES — rathole.netprofile.v1 &amp; rthprof1:</text>
  <rect x="42" y="498" width="362" height="92" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="223.0" y="520" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">JSON + rthprof1: Base64url Codec</text>
  <text x="223.0" y="539" text-anchor="middle" font-size="11" fill="#6d28d9">gzip + canonical URL-safe Base64 + SHA-256 check</text>
  <text x="223.0" y="556" text-anchor="middle" font-size="11" fill="#6d28d9">Paste into AI to diagnose DC bottlenecks or share</text>
  <rect x="420" y="498" width="362" height="92" rx="11" fill="#ffffff" stroke="#007aff" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="601.0" y="520" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">Live A/B/N Testing (bench test)</text>
  <text x="601.0" y="539" text-anchor="middle" font-size="11" fill="#1d4ed8">Replays &amp; scores datacenter profiles head-to-head</text>
  <text x="601.0" y="556" text-anchor="middle" font-size="11" fill="#1d4ed8">Keeps candidate only when goal score beats baseline</text>
  <rect x="798" y="498" width="362" height="92" rx="11" fill="#ffffff" stroke="#059669" stroke-opacity="0.58" stroke-width="1.2"/>
  <text x="979.0" y="520" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">RatholeHub #/tuner &amp; Library</text>
  <text x="979.0" y="539" text-anchor="middle" font-size="11" fill="#047857">Run live async bench · Import/Export rthprof1: strings</text>
  <text x="979.0" y="556" text-anchor="middle" font-size="11" fill="#047857">One-click Apply or Rollback saved DC profiles per host</text>
  <text x="24" y="632" text-anchor="start" font-size="11" font-weight="500" fill="#64748b">Every experiment snapshots live kernel settings first — unsafe changes trigger deterministic dead-man rollback without SSH lockout.</text>
</svg>
